lumns:88px 1fr;gap:15px}.score{width:86px;height:86px;border-width:6px}.score strong{font-size:29px}.report-head h1{font-size:27px}.profiles{grid-template-columns:1fr 1fr}.profile{padding:13px}.report-actions .btn{font-size:12px;min-height:38px;padding:9px 11px}.foot{padding-left:18px;padding-right:18px}dialog{padding:21px}.entry-row label{min-width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}@media print{body{background:white;font-size:10pt;color:#111}.topbar,.progress-shell,.aside,.foot,.report-actions,.btn,button,.no-print{display:none!important}.report{max-width:none;padding:0;margin:0}.report-head{display:flex}.report-head h1{font-size:24pt}.score{width:85px;height:85px}.score strong{font-size:28px}.profiles{display:flex;gap:6px}.profile{flex:1;padding:9px}.profile h3{font-size:9px}.profile strong{font-size:18px}.card{box-shadow:none;break-inside:avoid;padding:12px;margin-bottom:13px}.proposal-row{grid-template-columns:125px 1fr;font-size:9pt;padding:10px 0}.report details{display:block}.report details>div{display:block}.feedback,.history-item{break-inside:avoid}.print-only{display:block}h2,h3{break-after:avoid}.note{break-inside:avoid}a{color:#111}@page{size:A4;margin:16mm}}
</style></head><body><a class="skip" href="#main">Vai al contenuto</a><div id="app"></div><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" role="status" aria-live="polite"></div><script>globalThis.RiunioneContent = {
  version:'2.0.0',storageKey:'genova-prima-riunione-v2',minutes:10,
  title:'La prima riunione sull’IA',
  sourceRepo:'https://github.com/gigicogo/Prima-riunione-sul-regolamento',
  stages:[
    {id:'1',short:'Usi esistenti',title:'Da quali informazioni parti?',lead:'La direzione vuole una proposta fondata su ciò che succede negli uffici. Scegli la prima ricognizione da proporre.',options:[
      {id:'map',text:'Raccoglierei strumenti e account già usati, attività e categorie di dati trattati. Chiederei a ogni ufficio un referente, includendo gli usi che non hanno ancora un perimetro chiaro.',points:5,mandate:'Ricognizione degli strumenti già usati, degli account, delle attività e delle categorie di dati, con un referente per ufficio.',feedback:'La ricognizione collega strumenti, attività e dati. Comprende gli usi informali senza ridursi alla ricerca dei responsabili di un errore.'},
      {id:'priority',text:'Partirei dagli uffici che trattano informazioni più delicate, ricostruendo strumenti e modalità d’uso. Estenderei poi la ricognizione agli altri servizi, dichiarando quali uffici restano ancora da verificare.',points:4,mandate:'Ricognizione progressiva, iniziando dagli uffici con informazioni delicate e dichiarando i servizi ancora da verificare.',feedback:'Un avvio progressivo è difendibile. Occorre rendere visibili i limiti della prima ricognizione e fissare come estenderla: il campione non descrive automaticamente tutto l’ente.'},
      {id:'law',text:'Preparerei una matrice degli obblighi normativi e una checklist da distribuire agli uffici. Raccoglierei gli strumenti e gli utilizzi effettivi quando i referenti avranno completato la lettura delle regole.',points:3,mandate:'Matrice degli obblighi e checklist per gli uffici, con ricognizione degli utilizzi prevista dopo la lettura delle regole.',feedback:'La lettura delle regole è utile, ma rinvia i fatti necessari per applicarle. Una ricognizione essenziale può procedere in parallelo.'},
      {id:'market',text:'Confronterei sicurezza, condizioni contrattuali e costi di due servizi istituzionali. Chiederei poi agli uffici di descrivere le attività che potrebbero essere trasferite sullo strumento più adatto.',points:3,mandate:'Confronto fra due servizi istituzionali, seguito dalla raccolta delle attività candidate al loro utilizzo.',feedback:'Valutare i servizi è necessario quando si sceglie una soluzione. Qui il primo vuoto riguarda gli usi già presenti: il prodotto non definisce da solo il bisogno.'}
    ]},
    {id:'2',short:'Persone',title:'Chi coinvolgi nella prima riunione?',lead:'Il gruppo deve comprendere il lavoro degli uffici e preparare le decisioni. Nessun partecipante riassume tutte le competenze.',options:[
      {id:'process',text:'Coinvolgerei responsabili dei processi e RTD/ICT, con un referente della funzione che può assumere le decisioni. Privacy e sicurezza parteciperebbero per i profili pertinenti ai casi emersi.',points:5,mandate:'Responsabili dei processi e RTD/ICT, con la funzione competente per le decisioni e i presìdi privacy e sicurezza pertinenti.',feedback:'Il gruppo unisce conoscenza dei processi, coordinamento e competenze specifiche. I presìdi supportano secondo il proprio ruolo; non sostituiscono chi autorizza o decide.'},
      {id:'technical',text:'Riunirei prima RTD/ICT e funzione privacy per definire requisiti tecnici e cautele sui dati. I responsabili degli uffici interverrebbero dopo, per adattare il quadro ai rispettivi processi.',points:3,mandate:'Primo incontro fra RTD/ICT e funzione privacy, seguito dal coinvolgimento dei responsabili degli uffici.',feedback:'Le competenze tecniche e privacy servono, ma la prima impostazione rischia di perdere i bisogni operativi se i processi arrivano solo dopo.'},
      {id:'offices',text:'Riunirei i responsabili degli uffici che usano già l’IA e un referente della direzione. Chiederei successivamente a RTD/ICT e agli altri presìdi di verificare le condizioni elaborate dal gruppo.',points:3,mandate:'Primo incontro con gli uffici utilizzatori e la direzione, con verifica successiva di RTD/ICT e altri presìdi.',feedback:'Il punto di vista degli uffici è essenziale. Il confronto iniziale con RTD/ICT e le funzioni pertinenti evita di costruire proposte su condizioni tecniche non verificate.'},
      {id:'staff',text:'Partirei da direzione, Personale e relazioni sindacali per chiarire gli effetti sul lavoro. Coinvolgerei i referenti tecnici e di processo quando saranno individuate le prime attività da sperimentare.',points:3,mandate:'Primo confronto sugli effetti sul lavoro, con coinvolgimento successivo dei referenti tecnici e di processo.',feedback:'Gli effetti sul lavoro meritano il confronto previsto dalle regole applicabili. Per questa prima ricognizione servono anche chi conosce i processi e chi coordina il digitale.'}
    ]},
    {id:'3',short:'Regola provvisoria',title:'Quale indicazione proponi per gli uffici?',lead:'Esiste un ambiente istituzionale autorizzato per testi pubblici. Gli altri impieghi vanno chiariti: una proposta del gruppo non estende le autorizzazioni.',options:[
      {id:'perimeter',text:'Proporrei di esplicitare attività e dati consentiti nell’ambiente istituzionale. Gli uffici verificherebbero gli output prima dell’uso e porterebbero ai referenti le richieste che escono dal perimetro autorizzato.',proportion:5,clarity:5,mandate:'Attività e dati compatibili solo nell’ambiente autorizzato, con verifica dell’output e invio ai referenti delle richieste fuori dal perimetro.',feedback:'La proposta rende applicabili condizioni già definite, individua un controllo e apre un percorso per le nuove richieste. L’adozione dell’indicazione compete alla funzione autorizzante.'},
      {id:'publicpilot',text:'Proporrei una fase iniziale limitata alle bozze da fonti pubbliche nell’ambiente già autorizzato. Ogni risultato richiederebbe verifica; gli altri utilizzi passerebbero da una richiesta motivata al referente competente.',proportion:5,clarity:5,mandate:'Prima fase limitata alle bozze da fonti pubbliche nell’ambiente autorizzato, con verifica e richiesta motivata per gli altri utilizzi.',feedback:'È un avvio circoscritto e proporzionato al caso. Non blocca l’attività già consentita e lascia ai soggetti competenti la valutazione degli altri impieghi.'},
      {id:'nonames',text:'Proporrei di usare documenti senza nomi negli strumenti scelti dagli uffici, mantenendo il controllo umano. Un riepilogo mensile degli utilizzi permetterebbe al referente di intervenire sulle eventuali criticità.',proportion:2,clarity:4,critical:'nonames',mandate:'Documenti senza nomi negli strumenti scelti dagli uffici, con controllo umano e riepilogo mensile degli utilizzi.',feedback:'Togliere i nomi può lasciare elementi identificativi e non rende autorizzato lo strumento. Il controllo finale non risolve un inserimento fuori dal perimetro.'},
      {id:'existing',text:'Proporrei di mantenere gli utilizzi correnti, con verifica del responsabile di ufficio sui risultati. Il gruppo definirebbe entro trenta giorni l’elenco degli strumenti e delle attività da autorizzare.',proportion:2,clarity:4,critical:'existing',mandate:'Prosecuzione degli utilizzi correnti con verifica dei risultati, in attesa dell’elenco degli strumenti e delle attività da autorizzare.',feedback:'L’indicazione autorizzerebbe di fatto anche usi che non sono stati verificati. La responsabilità sul contenuto non estende il perimetro dello strumento o dei dati.'}
    ]},

  incident:{title:'Un documento è già finito in una chat personale',text:'Un collega riferisce che ieri ha incollato un verbale interno in un chatbot non autorizzato. Il documento conteneva nomi e situazioni individuali. Non sappiamo ancora quali dati il servizio abbia conservato o condiviso.',questions:[

      {id:'erase',text:'Chiederei al collega di cancellare chat e file dal servizio. Segnalerei poi al referente l’avvenuta rimozione, proponendo di considerare chiuso il problema dopo quella conferma.',points:2,critical:'erase',mandate:'Cancellare chat e file, poi segnalare la rimozione al referente proponendo la chiusura del caso.',feedback:'La rimozione non dimostra che non restino copie o conseguenze. Cancellare per iniziativa personale può compromettere la ricostruzione; si seguono le istruzioni delle funzioni competenti.'},

  critical:{

    existing:{title:'Prosecuzione di usi non verificati',detail:'La verifica sul risultato non consente di estendere automaticamente strumenti, account e dati ammessi.'},

</script><script>globalThis.RiunioneEngine=(()=>{
  const C=globalThis.RiunioneContent,clone=x=>JSON.parse(JSON.stringify(x)),same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  const option=(id,pick)=>C.stages.find(s=>s.id===String(id))?.options.find(o=>o.id===pick);
  const eventOption=(id,pick)=>C.incident.questions.find(q=>q.id===id)?.options.find(o=>o.id===pick);
  const defaults=id=>id==='incident'?{now:'',parallel:''}:id==='final'?{handover:'',reason:'',open:''}:{choice:''};
  function shuffled(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
  function createState(alias='',mode='individual',now=Date.now()){
    const ids=['1','2','3','4','incident','final'];
    return {version:C.version,id:'RIUN-'+Math.random().toString(36).slice(2,8).toUpperCase(),alias:alias.trim().slice(0,50),mode:mode==='group'?'group':'individual',startedAt:now,submittedAt:null,current:'1',returnTo:'1',incidentSeen:false,incidentTrigger:null,incidentAcknowledged:false,expired:false,timing:{leftMs:600000,endAt:now+600000,running:true},drafts:Object.fromEntries(ids.map(id=>[id,defaults(id)])),answers:{},first:{},history:[],order:Object.fromEntries(C.stages.map(s=>[s.id,shuffled(s.options.map(o=>o.id))])),eventOrder:Object.fromEntries(C.incident.questions.map(q=>[q.id,shuffled(q.options.map(o=>o.id))]))};
  }
  function left(s,now=Date.now()){return s.timing.running?Math.max(0,s.timing.endAt-now):Math.max(0,s.timing.leftMs);}
  function reveal(s,why,now=Date.now()){
    if(s.incidentSeen||s.submittedAt)return false;
    s.incidentSeen=true;s.incidentTrigger={why,at:now};s.returnTo=['1','2','3','4'].includes(s.current)?s.current:'4';s.current='incident';return true;
  }
  function tick(s,now=Date.now()){
    if(!s||s.submittedAt)return false;
    const remaining=left(s,now);let changed=false;
    if(remaining<=300000&&!s.incidentSeen&&s.timing.running)changed=reveal(s,'half',now)||changed;
    if(remaining===0&&s.timing.running){s.expired=true;s.timing.running=false;s.timing.leftMs=0;s.timing.endAt=null;changed=true;}
    return changed;
  }
  function toggleTimer(s,now=Date.now()){
    if(s.submittedAt||left(s,now)===0)return;
    if(s.timing.running){s.timing.leftMs=left(s,now);s.timing.endAt=null;s.timing.running=false;}else{s.timing.endAt=now+s.timing.leftMs;s.timing.running=true;}
  }
  function validate(id,a){
    if(['1','2','3','4'].includes(id))return option(id,a?.choice)?[]:['Scegli la formulazione da inserire nella proposta.'];
    if(id==='incident'){const e=[];for(const q of C.incident.questions)if(!eventOption(q.id,a?.[q.id]))e.push(q.id==='now'?'Scegli la risposta immediata.':'Scegli come prosegue il lavoro sulla proposta.');return e;}
    const e=[];if(!C.handovers.some(x=>x.id===a?.handover))e.push('Indica lo stato con cui trasmetti il documento.');if(String(a?.reason||'').trim().length<60)e.push('Motiva in almeno 60 caratteri: primo passo, limite scelto e decisione da sottoporre.');return e;
  }
  function record(s,id,answer,now=Date.now()){
    if(s.submittedAt)return {ok:false,errors:['La proposta è già consegnata.']};
    const errors=validate(id,answer);if(errors.length)return {ok:false,errors};
    const a=clone(answer),before=s.answers[id]?clone(s.answers[id]):null,initial=!s.first[id];
    if(initial)s.first[id]=clone(a);
    if(initial||!same(before,a))s.history.push({stage:id,type:initial?'first':'revision',at:now,before,answer:clone(a)});
    s.answers[id]=clone(a);s.drafts[id]=clone(a);if(id==='incident')s.incidentAcknowledged=true;
    return {ok:true,initial};
  }
  const mainComplete=s=>C.stages.every(x=>s.answers[x.id]);
  function nextAfterMain(s,id,now=Date.now()){
    if(mainComplete(s)){
      if(!s.incidentSeen){reveal(s,'completed',now);return;}
      s.current=s.answers.incident?'review':'incident';return;
    }
    const start=C.stages.findIndex(x=>x.id===id);
    for(let i=1;i<=4;i++){const sid=C.stages[(start+i)%4].id;if(!s.answers[sid]){s.current=sid;return;}}
  }
  function dirty(s){return Object.keys(s.answers).filter(id=>!same(s.answers[id],s.drafts[id]));}
  function readiness(s){
    const e=[];for(const id of ['1','2','3','4','incident','final']){
      if(!s.answers[id])e.push(id==='incident'?'Registra la gestione dell’imprevisto.':id==='final'?'Completa la consegna.':`Registra la decisione ${id}.`);
      else e.push(...validate(id,s.answers[id]));
    }
    for(const id of dirty(s))e.push(`Ci sono modifiche non registrate: ${id==='incident'?'imprevisto':id==='final'?'consegna':'decisione '+id}.`);
    return [...new Set(e)];
  }
  function assess(a){
    const one=option('1',a?.['1']?.choice),two=option('2',a?.['2']?.choice),three=option('3',a?.['3']?.choice),four=option('4',a?.['4']?.choice),n=eventOption('now',a?.incident?.now),p=eventOption('parallel',a?.incident?.parallel);
    const pts={concrete:Math.round(((one?.points||0)+(four?.points||0))/2),people:two?.points||0,proportion:three?.proportion||0,clarity:three?.clarity||0,incident:Math.round(((n?.points||0)+(p?.points||0))/2)};
    const domains=C.domains.map(d=>({...d,points:pts[d.id],max:5})),critical=[];
    for(const [id,o] of [['3',three],['incident',n],['incident',p]])if(o?.critical)critical.push({id:o.critical,stage:id,...C.critical[o.critical]});
    if(a?.final?.handover==='ready')critical.push({id:'authority',stage:'final',...C.critical.authority});
    const total=domains.reduce((s,d)=>s+d.points,0);
    const label=critical.length?'Proposta da riesaminare':a?.final?.handover==='memo'?'Proposta da completare':total>=21?'Proposta coerente da discutere':total>=15?'Buona base da completare':'Scelte da rivedere insieme';
    return {total,max:25,domains,critical,label};
  }
  function report(s){
    const current=assess(s.answers),first=assess(s.first),seen=new Map();
    for(const h of s.history){const candidate={...s.answers,[h.stage]:h.answer};for(const f of assess(candidate).critical)seen.set(f.id,f);}
    for(const f of first.critical)seen.set(f.id,f);
    const open=new Set(current.critical.map(f=>f.id));
    return {current,first,recovered:[...seen.values()].filter(f=>!open.has(f.id)),revisions:s.history.filter(h=>h.type==='revision').length};
  }
  function submit(s,now=Date.now()){
    const errors=readiness(s);if(errors.length)return {ok:false,errors};
    s.timing.leftMs=left(s,now);s.timing.running=false;s.timing.endAt=null;s.submittedAt=now;s.current='report';return {ok:true};
  }
  function choiceRows(a){
    const rows=C.stages.map(s=>[s.short,option(s.id,a?.[s.id]?.choice)?.mandate||'Da completare']);
    for(const q of C.incident.questions)rows.push([q.id==='now'?'Imprevisto: subito':'Imprevisto: in parallelo',eventOption(q.id,a?.incident?.[q.id])?.mandate||'Da completare']);
    return rows;
  }
  function toText(s){
    const r=report(s);return `${C.title}\nProposta di mandato · ${s.alias||s.id}\n\n${choiceRows(s.answers).map(([k,v],i)=>`${i+1}. ${k}\n${v}`).join('\n\n')}\n\nStato della consegna\n${C.handovers.find(x=>x.id===s.answers.final?.handover)?.text||'Da definire'}\n\nMotivazione\n${s.answers.final?.reason||''}\n\nQuestioni aperte\n${s.answers.final?.open||'Non indicate dal partecipante.'}\n\nEsito didattico: ${r.current.total}/25 · ${r.current.label}\nCriticità aperte: ${r.current.critical.map(f=>f.title).join('; ')||'nessuna rilevata automaticamente'}.\nCriticità recuperate: ${r.recovered.map(f=>f.title).join('; ')||'nessuna'}.\n\nIl contenuto è una proposta didattica. Le autorizzazioni e l’adozione delle regole spettano ai soggetti competenti. La motivazione richiede la lettura del docente.\n`;
  }
  return {clone,same,option,eventOption,defaults,createState,left,reveal,tick,toggleTimer,validate,record,mainComplete,nextAfterMain,dirty,readiness,assess,report,submit,choiceRows,toText};
})();
</script><script>(()=>{
  'use strict';
  const C=globalThis.RiunioneContent,E=globalThis.RiunioneEngine,root=document.getElementById('app'),dialog=document.getElementById('dialog');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const when=v=>new Date(v).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'});
  const fmt=ms=>{const s=Math.ceil(Math.max(0,ms)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
  let state=null,errors=[],timerId,toastId,pitch={running:false,endAt:null,leftMs:60000},mode='individual';
  try{const s=JSON.parse(localStorage.getItem(C.storageKey)||'null');if(s?.version===C.version&&s.drafts&&s.answers&&s.first&&s.timing&&s.order&&s.eventOrder&&Array.isArray(s.history)){state=s;E.tick(state);}}catch{}
  function save(){if(!state)return;try{localStorage.setItem(C.storageKey,JSON.stringify(state));}catch{toast('Il browser non conserva i progressi. Lascia aperta la pagina e scarica la scheda alla consegna.');}}
  function toast(text){const el=document.getElementById('toast');el.textContent=text;el.style.display='block';clearTimeout(toastId);toastId=setTimeout(()=>{el.style.display='none';},3600);}

  function footer(){return `<footer class="foot">Ideazione didattica: Gianluigi Cogo · Versione ${C.version} · Scenario fittizio · Nessun account IA richiesto<\/footer>`;}
  function brief(){return `<p>Il dirigente chiede ai funzionari una <strong>proposta per i primi trenta giorni<\/strong>: capire gli usi già presenti, coinvolgere le funzioni pertinenti e preparare indicazioni per gli uffici.<\/p><p>L’ente ha già un <strong>ambiente istituzionale autorizzato per lavorare su testi pubblici<\/strong>. Gli uffici lo usano per bozze e sintesi. Alcuni servizi riferiscono anche usi di altri chatbot; account, dati e condizioni non sono ancora ricostruiti.<\/p><p>Un ufficio propone inoltre di collegare una cartella interna. Il collegamento <strong>non è stato autorizzato<\/strong>: è una richiesta da descrivere e sottoporre ai referenti.<\/p><div class="note"><strong>Il tuo ruolo.<\/strong> Raccogli informazioni, proponi condizioni e rendi visibili le decisioni aperte. L’autorizzazione di nuovi impieghi e l’adozione delle regole spettano ai soggetti competenti.<\/div><p class="small muted">Tutte le situazioni sono inventate per il laboratorio. Non descrivono strumenti, procedure o incidenti reali del Comune di Genova.<\/p>`;}
  function landing(){root.innerHTML=top()+`<main class="landing" id="main"><div class="hero"><section><div class="eyebrow">Attività di avvio · 10 minuti di lavoro<\/div><h1>Da dove partiamo<br>con l’IA in ufficio?<\/h1><p class="lead">L’ente ha un assistente autorizzato per testi pubblici, ma altri usi dell’IA restano poco chiari. Il dirigente chiede una proposta concreta per i primi trenta giorni.<\/p><div class="facts"><span class="fact">4 decisioni<\/span><span class="fact">1 imprevisto<\/span><span class="fact">1 proposta motivata<\/span><\/div><div class="entry"><div class="mode-switch" role="group" aria-label="Modalità di lavoro"><label class="mode-choice"><input type="radio" name="mode" value="individual" checked>Individuale<\/label><label class="mode-choice"><input type="radio" name="mode" value="group">Gruppo di 4–5<\/label><\/div><div class="entry-row"><label><span>Codice partecipante o nome del gruppo · facoltativo<\/span><input id="alias" placeholder="Es. Corsista 07 o Gruppo Blu" maxlength="50" autocomplete="off"><\/label><button class="btn primary" data-action="start">Inizia la riunione →<\/button><\/div><p class="small muted" style="margin-top:12px">Il timer parte all’avvio e si può mettere in pausa. Allo scadere puoi completare la proposta.<\/p><\/div><\/section><section class="preview"><div class="preview-top"><h3>La proposta alla direzione<\/h3><span class="tag amber">Da preparare<\/span><\/div>${[['01','Usi esistenti','Che cosa dobbiamo conoscere prima di decidere?'],['02','Persone da coinvolgere','Chi porta i processi, chi supporta e chi può decidere?'],['03','Indicazione provvisoria','Che cosa proponiamo per il lavoro di domani?'],['04','Risultato entro 30 giorni','Quale consegna concreta possiamo preparare?']].map(([n,h,t])=>`<div class="preview-row"><span>${n}<\/span><div><strong>${h}<\/strong>${t}<\/div><\/div>`).join('')}<div class="preview-note">Gli errori critici restano evidenti<br><strong>anche con un punteggio alto.<\/strong><\/div><\/section><\/div><div class="intro-foot"><p><strong>Come funziona:<\/strong> scegli le formulazioni, registra le decisioni e motiva la proposta finale. Puoi rivedere le scelte: la prima decisione registrata resta nella scheda.<\/p><p>L’imprevisto arriva dopo cinque minuti di tempo attivo, oppure prima se completi le quattro decisioni. Le spiegazioni si aprono alla consegna. La motivazione richiede la lettura del docente.<\/p><p>Progressi e risposte restano nel browser. Alla fine puoi scaricare o copiare la proposta completa. L’app funziona anche offline e non invia le risposte al docente.<\/p><\/div><\/main>`+footer();}
  function nav(){const current=state.current,complete=E.mainComplete(state)&&state.answers.incident;return `<nav class="progress-shell" aria-label="Percorso della riunione"><div class="progress">${C.stages.map(s=>`<button class="step ${current===s.id?'active':''} ${state.answers[s.id]?'done':''}" data-action="go" data-step="${s.id}" ${current===s.id?'aria-current="step"':''} title="${s.id}. ${esc(s.short)}"><span class="num">${state.answers[s.id]?'✓':s.id}<\/span><span class="step-label">${s.short}<\/span><\/button>`).join('')}<button class="step event ${current==='incident'?'active':''} ${state.answers.incident?'done':''}" data-action="go" data-step="incident" ${state.incidentSeen?'':'disabled'} ${current==='incident'?'aria-current="step"':''} title="Imprevisto"><span class="num">${state.answers.incident?'✓':'!'}<\/span><span class="step-label">Imprevisto<\/span><\/button><button class="step ${current==='review'?'active':''}" data-action="go" data-step="review" ${complete?'':'disabled'} ${current==='review'?'aria-current="step"':''} title="Proposta finale"><span class="num">6<\/span><span class="step-label">Proposta<\/span><\/button><\/div><\/nav>`;}
  function aside(){return `<aside class="aside"><div class="timer-box ${state.expired?'expired':''}" id="timer-box"><div class="eyebrow">Tempo guida<\/div><div class="timer-row"><span class="timer-value" id="time-left">${fmt(E.left(state))}<\/span><button class="btn ghost tiny" data-action="timer" id="timer-toggle" aria-label="${state.timing.running?'Metti in pausa il timer':'Riprendi il timer'}" ${E.left(state)===0?'disabled':''}>${state.timing.running?'Pausa':'Riprendi'}<\/button><\/div><div class="small timer-hint" id="timer-hint">${state.expired?'Tempo guida terminato. Puoi completare la proposta.':state.timing.running?'Il tempo continua durante le decisioni.':'Timer in pausa.'}<\/div><\/div><div class="context"><h3>Il perimetro del caso<\/h3><p>Ambiente istituzionale già autorizzato per <strong>testi pubblici<\/strong>. Gli altri usi sono da ricostruire.<\/p><div class="fact-row"><h3>La consegna<\/h3><p>Una proposta con primo passo, persone, indicazione provvisoria e risultato entro trenta giorni.<\/p><\/div><div class="fact-row"><h3>Chi decide<\/h3><p>I funzionari preparano gli elementi. Le funzioni competenti autorizzano gli impieghi e adottano le regole.<\/p><\/div><button class="btn tiny" data-action="brief">Rileggi l’incarico<\/button><\/div><p class="save-note">Salvataggio automatico in questo browser.<br>La prima scelta registrata resta conservata.<\/p><\/aside>`;}
  function errorBox(){return errors.length?`<div class="errors" role="alert" tabindex="-1"><p>Completa o registra questi elementi<\/p><ul>${errors.map(t=>`<li>${esc(t)}<\/li>`).join('')}<\/ul><\/div>`:'';}
  function choices(options,order,value,field,group){return `<div class="choices">${order.map((id,i)=>{const o=options.find(x=>x.id===id);return `<label class="choice"><input type="radio" name="${group}" data-field="${field}" value="${o.id}" ${value===o.id?'checked':''}><span class="option-letter" aria-hidden="true">${String.fromCharCode(65+i)}<\/span><span class="choice-body">${esc(o.text)}<\/span><\/label>`;}).join('')}<\/div>`;}
  function mainDecision(){const s=C.stages.find(x=>x.id===state.current),a=state.drafts[s.id];return `<div class="stage-head"><div class="eyebrow">Decisione ${s.id} di 4<\/div><h1>${s.title}<\/h1><p>${s.lead}<\/p><\/div>${errorBox()}${choices(s.options,state.order[s.id],a.choice,'choice','decision-'+s.id)}<div class="form-footer"><div class="small">${state.answers[s.id]?'Puoi registrare una revisione. La prima decisione resta conservata.':state.mode==='group'?'Discutete e scegliete la formulazione da inserire nella proposta.':'Scegli la formulazione che inseriresti nella proposta.'}<\/div><button class="btn primary" data-action="record-main">Registra e continua →<\/button><\/div>`;}
  function incident(){const a=state.drafts.incident;return `<div class="stage-head"><div class="eyebrow">Nuovo elemento nella riunione<\/div><h1 class="event-title">${C.incident.title}<\/h1><p>${C.incident.text}<\/p><\/div><div class="note amber">${state.incidentTrigger?.why==='completed'?'Hai completato le quattro decisioni: l’imprevisto arriva ora, prima della consegna.':'Sono trascorsi cinque minuti di tempo attivo: la riunione riceve una nuova informazione.'} Con questi elementi non puoi ancora stabilire le conseguenze dell’invio.<\/div>${errorBox()}${C.incident.questions.map(q=>`<fieldset class="choice-group"><legend>${q.title}<\/legend>${choices(q.options,state.eventOrder[q.id],a[q.id],q.id,'event-'+q.id)}<\/fieldset>`).join('')}<div class="form-footer"><span class="small">Distingui la gestione immediata dell’evento dal lavoro sulle regole.<\/span><button class="btn primary" data-action="record-incident">Registra la gestione dell’imprevisto →<\/button><\/div>`;}
  function proposalRows(answers,editable=false){return E.choiceRows(answers).map(([k,v],i)=>`<div class="proposal-row"><strong>${esc(k)}${editable?`<button class="question-link" data-action="go" data-step="${i<4?String(i+1):'incident'}">Rivedi<\/button>`:''}<\/strong><div>${esc(v)}<\/div><\/div>`).join('');}
  function handoverChoices(value){return `<div class="choices">${C.handovers.map(o=>`<label class="choice"><input type="radio" name="handover" data-field="handover" value="${o.id}" ${value===o.id?'checked':''}><span>${esc(o.text)}<\/span><\/label>`).join('')}<\/div>`;}
  function review(){const a=state.drafts.final;return `<div class="stage-head"><div class="eyebrow">Consegna della proposta<\/div><h1>Il mandato di avvio, da discutere<\/h1><p>Rileggi le decisioni, precisa lo stato della consegna e aggiungi una breve motivazione.<\/p><\/div>${errorBox()}<section class="card"><h2>La proposta che hai composto<\/h2>${proposalRows(state.answers,true)}<\/section><section class="card"><h3>Con quale stato la trasmetti?<\/h3>${handoverChoices(a.handover)}<\/section><section class="card"><label class="field"><span>La motivazione della proposta<\/span><textarea data-field="reason" rows="4" maxlength="1800" placeholder="Quale primo passo possono fare i funzionari? Motiva un limite scelto e indica quale decisione porti al responsabile.">${esc(a.reason)}<\/textarea><small>Almeno 60 caratteri. Il contenuto sarà letto dal docente, senza valutazione automatica del testo.<\/small><\/label><div class="counter" id="reason-count">${a.reason.length} caratteri<\/div><label class="field"><span>Una questione ancora aperta · facoltativa<\/span><textarea data-field="open" rows="2" maxlength="600" placeholder="Es. Chi riceve le richieste di nuovi utilizzi e dove documentiamo i riscontri?">${esc(a.open)}<\/textarea><\/label><\/section><div class="note green">Alla consegna si aprono il profilo delle scelte, le spiegazioni e le criticità aperte o recuperate. Il tentativo viene chiuso; puoi scaricare la scheda completa.<\/div><div class="form-footer"><span class="small">Un buon punteggio non sostituisce la decisione competente.<\/span><button class="btn primary" data-action="submit">Consegna e apri il confronto →<\/button><\/div>`;}
  function work(){root.innerHTML=top()+nav()+`<div class="layout"><main class="work" id="main">${state.current==='incident'?incident():state.current==='review'?review():mainDecision()}<\/main>${aside()}<\/div>`+footer();if(errors.length)document.querySelector('.errors')?.focus();}
  function selectedAnswer(id,a){if(id==='incident')return C.incident.questions.map(q=>[q.title,E.eventOption(q.id,a?.[q.id])?.text||'—']);if(id==='final')return [['Stato',C.handovers.find(o=>o.id===a?.handover)?.text||'—'],['Motivazione',a?.reason||'—'],['Questione aperta',a?.open||'Non indicata']];return [[C.stages.find(s=>s.id===id).short,E.option(id,a?.choice)?.text||'—']];}
  function answerDetails(id,a){return selectedAnswer(id,a).map(([k,v])=>`<p><strong>${esc(k)}:<\/strong> <span class="pre-wrap">${esc(v)}<\/span><\/p>`).join('');}
  function reportBody(){const r=E.report(state),v=r.current;return `<div class="report-head"><div class="score ${v.critical.length?'critical':''}"><div><strong>${v.total}<\/strong><span>punti su 25<\/span><\/div><\/div><div><div class="eyebrow">Esito didattico · ${esc(state.alias||state.id)}<\/div><h1>${v.label}<\/h1><p class="muted small">Prime decisioni registrate: <strong>${r.first.total}/25<\/strong> · Revisioni: <strong>${r.revisions}<\/strong><br>Consegna: ${when(state.submittedAt)} · Tempo attivo: ${fmt(600000-state.timing.leftMs)}.<\/p><\/div><\/div><div class="profiles">${v.domains.map(d=>`<div class="profile"><h3>${d.label}<\/h3><strong>${d.points}<\/strong><small> /5<\/small><div class="track"><i style="width:${d.points*20}%"><\/i><\/div><\/div>`).join('')}<\/div>${v.critical.length?`<section class="card"><h2>Criticità ancora aperte<\/h2><p class="small muted">Il totale non compensa questi errori. La proposta richiede un riesame.<\/p><ul class="flags">${v.critical.map(f=>`<li><strong>${esc(f.title)}<\/strong><br>${esc(f.detail)}<\/li>`).join('')}<\/ul><\/section>`:'<div class="note green"><strong>Nessuna criticità automatica ancora aperta.<\/strong> La motivazione richiede comunque la lettura del docente.<\/div>'}${r.recovered.length?`<section class="card"><h3>Criticità recuperate con una revisione<\/h3><ul class="flags">${r.recovered.map(f=>`<li>${esc(f.title)}<\/li>`).join('')}<\/ul><\/section>`:''}<section class="card"><div class="eyebrow">Proposta di mandato alla direzione<\/div><h2>Le decisioni da portare alla riunione<\/h2>${proposalRows(state.answers)}<div class="note"><strong>Stato della consegna:<\/strong> ${esc(C.handovers.find(x=>x.id===state.answers.final.handover).text)}<\/div><h3>Motivazione<\/h3><p class="pre-wrap">${esc(state.answers.final.reason)}<\/p>${state.answers.final.open?`<h3>Questione aperta<\/h3><p class="pre-wrap">${esc(state.answers.final.open)}<\/p>`:''}<p class="small muted">È una proposta didattica. L’autorizzazione degli impieghi e l’adozione delle regole spettano ai soggetti competenti.<\/p><\/section><details class="card"><summary>Le spiegazioni delle scelte<\/summary><div><p class="small muted">Più formulazioni possono essere valide. Il punteggio considera le scelte strutturate; non giudica automaticamente il significato della motivazione.<\/p>${C.stages.map(s=>{const o=E.option(s.id,state.answers[s.id].choice);return `<div class="feedback"><h3>${s.id}. ${esc(s.title)}<\/h3><p>${esc(o.text)}<\/p><p class="why">${esc(o.feedback)}<\/p><\/div>`;}).join('')}${C.incident.questions.map(q=>{const o=E.eventOption(q.id,state.answers.incident[q.id]);return `<div class="feedback"><h3>Imprevisto · ${esc(q.title)}<\/h3><p>${esc(o.text)}<\/p><p class="why">${esc(o.feedback)}<\/p><\/div>`;}).join('')}<div class="feedback"><h3>Come si costruisce il profilo<\/h3><p>Concretezza: media arrotondata delle decisioni 1 e 4. Coinvolgimento: decisione 2. Proporzione e chiarezza delle formulazioni: decisione 3. Gestione dell’imprevisto: media arrotondata delle due risposte. Ogni criterio vale fino a cinque punti.<\/p><p class="why">Le criticità restano separate e precedono le fasce numeriche. Per esempio, rinviare la segnalazione può lasciare un totale di 23/25, ma impedisce un esito positivo senza riesame.<\/p><\/div><\/div><\/details><details class="card"><summary>Prima decisione, ultima versione e registro delle revisioni<\/summary><div>${['1','2','3','4','incident','final'].map(id=>`<div class="history-item"><h3>${id==='incident'?'Gestione dell’imprevisto':id==='final'?'Consegna':'Decisione '+id}<\/h3>${E.same(state.first[id],state.answers[id])?'<p class="small muted">La prima decisione registrata coincide con la consegna.<\/p>':`<div class="before"><p><strong>Prima decisione registrata<\/strong><\/p>${answerDetails(id,state.first[id])}<\/div><p><strong>Ultima versione registrata<\/strong><\/p>`}${answerDetails(id,state.answers[id])}<\/div>`).join('')}<h3 style="margin-top:24px">Revisioni intermedie<\/h3>${state.history.filter(h=>h.type==='revision').map(h=>`<div class="history-item"><h3>${h.stage==='incident'?'Imprevisto':h.stage==='final'?'Consegna':'Decisione '+h.stage} · ${when(h.at)}<\/h3>${answerDetails(h.stage,h.answer)}<\/div>`).join('')||'<p>Nessuna revisione registrata.<\/p>'}<p class="small muted">Il registro conserva le decisioni confermate con il pulsante, non ogni clic di compilazione. Le prime decisioni dei diversi passaggi possono essere state registrate in momenti diversi.<\/p><\/div><\/details><div class="note"><strong>Per il confronto in aula:<\/strong> quale scelta hai rivisto? Quale informazione manca ancora? Chi deve assumere la decisione successiva?<\/div>`;}
  function report(){root.innerHTML=top()+`<main class="report" id="main"><div class="report-actions"><button class="btn primary" data-action="download">Scarica la scheda HTML<\/button><button class="btn" data-action="print">Apri scheda per stampa / PDF<\/button><button class="btn" data-action="copy">Copia la proposta completa<\/button><\/div>${reportBody()}<section class="card no-print"><h3>Un minuto per presentare<\/h3><p class="small muted">Primo passo, limite scelto e decisione da portare al responsabile. Il timer di restituzione è separato dal tempo della prova.<\/p><div class="pitch"><strong id="pitch-time">${fmt(pitch.leftMs)}<\/strong><button class="btn tiny" data-action="pitch" id="pitch-button">Avvia 60 secondi<\/button><button class="btn tiny" data-action="pitch-reset">Azzera e riparti da 60<\/button><\/div><\/section><details class="card no-print"><summary>Altri formati per conservare la proposta<\/summary><div class="report-actions" style="margin-top:16px;margin-bottom:0"><button class="btn tiny" data-action="markdown">Scarica testo Markdown<\/button><button class="btn tiny" data-action="json">Esporta risposte JSON<\/button><\/div><\/details><\/main>`+footer();}
  function standalone(){return `<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prima riunione · Scheda ${esc(state.alias||state.id)}<\/title><style>${document.querySelector('style').textContent}<\/style><\/head><body><main class="report"><div class="report-actions"><button class="btn primary" onclick="window.print()">Stampa / salva PDF<\/button><\/div>${reportBody()}<\/main><script>document.querySelectorAll('details').forEach(function(d){d.open=true;});<\/script><\/body><\/html>`;}
  function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
  function showDialog(title,body){dialog.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${esc(title)}<\/h2><button class="close" data-action="close" aria-label="Chiudi">×<\/button><\/div>${body}`;dialog.showModal();}
  function render(){if(!state)landing();else if(state.submittedAt)report();else work();}
  function go(id){if(state.submittedAt)return;if(id==='incident'&&!state.incidentSeen)return;if(id==='review'&&!(E.mainComplete(state)&&state.answers.incident))return;state.current=id;errors=[];save();render();window.scrollTo({top:0,behavior:'instant'});const h=document.querySelector('#main h1');h?.setAttribute('tabindex','-1');h?.focus({preventScroll:true});}
  function updateTimer(){if(!state||state.submittedAt)return;const t=document.getElementById('time-left');if(t)t.textContent=fmt(E.left(state));const btn=document.getElementById('timer-toggle');if(btn){btn.textContent=state.timing.running?'Pausa':'Riprendi';btn.setAttribute('aria-label',state.timing.running?'Metti in pausa il timer':'Riprendi il timer');btn.disabled=E.left(state)===0;}const hint=document.getElementById('timer-hint');if(hint)hint.textContent=state.expired?'Tempo guida terminato. Puoi completare la proposta.':state.timing.running?'Il tempo continua durante le decisioni.':'Timer in pausa.';document.getElementById('timer-box')?.classList.toggle('expired',state.expired);}
  document.addEventListener('input',event=>{const el=event.target;if(!state||state.submittedAt||!el.dataset.field)return;const id=state.current==='review'?'final':state.current;state.drafts[id][el.dataset.field]=el.value;save();if(el.dataset.field==='reason'){const c=document.getElementById('reason-count');if(c)c.textContent=el.value.length+' caratteri';}});
  document.addEventListener('change',event=>{const el=event.target;if(el.name==='mode'){mode=el.value;return;}if(!state||state.submittedAt||!el.dataset.field)return;const id=state.current==='review'?'final':state.current;state.drafts[id][el.dataset.field]=el.value;save();});
  document.addEventListener('click',async event=>{
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
    if(a==='close'){dialog.close();return;}
    if(a==='brief'){showDialog('L’incarico per la prima riunione',brief());return;}
    if(a==='start'){state=E.createState(document.getElementById('alias')?.value||'',document.querySelector('input[name="mode"]:checked')?.value||mode);errors=[];save();render();window.scrollTo({top:0});return;}
    if(a==='restart'){showDialog('Avviare un nuovo tentativo?',`<p>Scarica la scheda prima di ripartire. Il nuovo tentativo sostituirà quello conservato in questo browser.<\/p><div class="report-actions"><button class="btn primary" data-action="new">Avvia nuovo tentativo<\/button><button class="btn" data-action="close">Torna alla scheda<\/button><\/div>`);return;}
    if(a==='new'){dialog.close();state=null;errors=[];pitch={running:false,endAt:null,leftMs:60000};try{localStorage.removeItem(C.storageKey);}catch{}render();window.scrollTo({top:0});return;}
    if(!state)return;
    if(a==='go'){go(b.dataset.step);return;}
    if(a==='timer'){E.toggleTimer(state);save();updateTimer();return;}
    if(a==='record-main'){const id=state.current,r=E.record(state,id,state.drafts[id]);if(!r.ok){errors=r.errors;render();return;}E.nextAfterMain(state,id);save();errors=[];render();window.scrollTo({top:0});toast(r.initial?'Decisione registrata.':'Revisione registrata.');return;}
    if(a==='record-incident'){const r=E.record(state,'incident',state.drafts.incident);if(!r.ok){errors=r.errors;render();return;}state.current=E.mainComplete(state)?'review':state.returnTo;save();errors=[];render();window.scrollTo({top:0});toast(r.initial?'Gestione dell’imprevisto registrata.':'Revisione dell’imprevisto registrata.');return;}
    if(a==='submit'){const r=E.record(state,'final',state.drafts.final);if(!r.ok){errors=r.errors;render();return;}const result=E.submit(state);if(!result.ok){errors=result.errors;save();render();return;}save();render();window.scrollTo({top:0});return;}
    if(!state.submittedAt)return;
    if(a==='download'){download('Scheda_prima_riunione_'+state.id+'.html',standalone(),'text/html;charset=utf-8');toast('Scheda scaricata. Puoi restituirla tramite il canale del corso.');return;}
    if(a==='print'){const w=window.open('','_blank');if(w){w.document.open();w.document.write(standalone());w.document.close();}else toast('Finestra bloccata: scarica la scheda HTML e aprila per stampare.');return;}
    if(a==='copy'){const text=E.toText(state);try{if(!navigator.clipboard?.writeText)throw Error('clipboard');await navigator.clipboard.writeText(text);toast('Copiata la proposta completa, con imprevisto, motivazione e criticità.');}catch{showDialog('Copia della proposta',`<p class="small muted">Puoi selezionare e copiare il testo completo oppure scaricarlo.<\/p><textarea readonly rows="14" aria-label="Proposta completa da copiare">${esc(text)}<\/textarea><button class="btn" style="margin-top:14px" data-action="markdown">Scarica testo Markdown<\/button>`);}return;}
    if(a==='markdown'){download('Proposta_prima_riunione_'+state.id+'.md',E.toText(state),'text/markdown;charset=utf-8');return;}
    if(a==='json'){download('Risposte_prima_riunione_'+state.id+'.json',JSON.stringify({version:C.version,state,assessment:E.report(state)},null,2),'application/json');return;}
    if(a==='pitch'){if(pitch.running){pitch.leftMs=Math.max(0,pitch.endAt-Date.now());pitch.running=false;pitch.endAt=null;}else{if(pitch.leftMs<=0)pitch.leftMs=60000;pitch.endAt=Date.now()+pitch.leftMs;pitch.running=true;}document.getElementById('pitch-button').textContent=pitch.running?'Pausa restituzione':'Riprendi restituzione';return;}
    if(a==='pitch-reset'){pitch={running:false,endAt:null,leftMs:60000};document.getElementById('pitch-time').textContent='1:00';document.getElementById('pitch-button').textContent='Avvia 60 secondi';}
  });
  dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
  timerId=setInterval(()=>{
    if(state&&!state.submittedAt){if(E.tick(state)){save();errors=[];render();window.scrollTo({top:0});}else updateTimer();}
    if(pitch.running){pitch.leftMs=Math.max(0,pitch.endAt-Date.now());const el=document.getElementById('pitch-time');if(el)el.textContent=fmt(pitch.leftMs);if(pitch.leftMs===0){pitch.running=false;const b=document.getElementById('pitch-button');if(b)b.textContent='Riparti da 60 secondi';}}
  },1000);
  if(state)save();render();
})();
</script></body></html>
